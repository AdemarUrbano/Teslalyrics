<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letras</title>
<style>
:root{--bg:#14171f;--ink:#f1ede4;--dim:#6b7285;--hi:#ffb86b;--panel:#1d212c;--fs:1;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #262b38}
#track{font-size:1rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track b{color:var(--ink);font-weight:600}
button{font:inherit;background:var(--hi);color:#2a1a05;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--dim);border:1px solid #333a4a;font-weight:400;padding:6px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 6vw;overflow:hidden;text-align:center;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#reel{position:absolute;left:0;right:0;top:0;transition:transform .8s cubic-bezier(.25,.8,.25,1);will-change:transform}
.line{width:64%;margin:0 auto;padding:.8em 0;font-size:calc(clamp(1.2rem,2.8vw,2rem) * var(--fs));font-weight:600;line-height:1.3;color:var(--dim);transform-origin:center;transition:transform .6s cubic-bezier(.25,.8,.25,1),opacity .6s,color .6s;cursor:pointer}
.line.cur{color:var(--hi)}
#plain{white-space:pre-wrap;text-align:left;max-width:60ch;margin:0 auto;overflow:auto;min-height:0;max-height:100%;font-size:calc(1.4rem * var(--fs));line-height:1.5;color:var(--ink);scroll-behavior:smooth}
.msg{color:var(--dim);font-size:1.2rem;max-width:46ch;margin:0 auto;line-height:1.5}
#setup{max-width:520px;margin:0 auto;text-align:left;background:var(--panel);padding:22px;border-radius:14px;display:none}
#setup label{display:block;margin:12px 0 6px;color:var(--dim);font-size:.9rem}
#setup input{width:100%;padding:10px;border-radius:8px;border:1px solid #333a4a;background:#12151c;color:var(--ink);font:inherit}
#setup code{background:#12151c;padding:2px 6px;border-radius:5px;word-break:break-all;font-size:.85rem}
#setup button{margin-top:16px}
footer{padding:10px 22px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-top:1px solid #262b38;color:var(--dim);font-size:.9rem}
footer label{display:flex;gap:6px;align-items:center;cursor:pointer}
.grp{display:flex;gap:6px;align-items:center}
.grp button{padding:4px 10px;min-width:34px}
.grp output{min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums}
:root[data-theme="light"]{--bg:#f4f1ea;--ink:#1c2030;--dim:#6f7588;--hi:#b8520a;--panel:#fff;color-scheme:light}
:root[data-theme="light"] header,:root[data-theme="light"] footer{border-color:#ddd6c6}
:root[data-theme="light"] button.ghost,:root[data-theme="light"] #setup input{border-color:#d3ccbb}
:root[data-theme="light"] #setup input,:root[data-theme="light"] #setup code{background:#f4f1ea;color:var(--ink)}
:root[data-theme="light"] button:not(.ghost){color:#fff}
#ver{position:fixed;right:10px;bottom:8px;font-size:.7rem;color:var(--dim);opacity:.8;pointer-events:none}
body.moving main{filter:blur(18px);opacity:.15;pointer-events:none}
@media (prefers-reduced-motion:reduce){.line,#reel,#plain{transition:none;scroll-behavior:auto}}
</style>
</head>
<body>
<header><div id="track">Nada a tocar</div><div style="display:flex;gap:8px;align-items:center;flex:none"><button class="ghost" id="theme">Claro</button><button class="ghost" id="logout" hidden>Sair</button></div></header>
<main id="main"></main>
<footer>
  <div class="grp" title="Ajusta se a letra estiver adiantada (-) ou atrasada (+)">Sincronia
    <button class="ghost" id="offMinus" aria-label="Atrasar letra">-</button>
    <output id="offVal">0.0s</output>
    <button class="ghost" id="offPlus" aria-label="Adiantar letra">+</button>
  </div>
  <div class="grp">Texto
    <button class="ghost" id="fsMinus" aria-label="Diminuir texto">A-</button>
    <button class="ghost" id="fsPlus" aria-label="Aumentar texto">A+</button>
  </div>
  <label><input type="checkbox" id="hideMoving"> Esconder letra com o carro em movimento (GPS)</label>
  <span id="speed"></span>
</footer>

<div id="ver">v1.6</div>
<script>
function showFatal(m){var e=document.getElementById("main");if(e){e.textContent="";var p=document.createElement("p");p.className="msg";p.textContent="Erro: "+m;e.appendChild(p);}}
window.addEventListener("error",function(e){showFatal(e.message);});
window.addEventListener("unhandledrejection",function(e){showFatal(e.reason&&e.reason.message||e.reason);});
</script>
<script>
const SCOPES = "user-read-currently-playing user-read-playback-state";
const CLIENT_ID = "6788a6ccc7f74d33be73b050dfa7ce06"; // cola aqui o teu Client ID, entre as aspas
const REDIRECT = location.origin + location.pathname;
const $ = id => document.getElementById(id);
const main = $("main"), trackEl = $("track");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- PKCE ---------- */
const rand = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/[+/=]/g,"").slice(0,n); };
async function challenge(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const id = CLIENT_ID || $("cid").value.trim();
  if(!id) return;
  store.set("cid", id);
  const verifier = rand(64);
  store.set("verifier", verifier);
  const p = new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:await challenge(verifier)});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  if(!r.ok) throw new Error("token " + r.status);
  const j = await r.json();
  store.set("access", j.access_token);
  store.set("expires", Date.now() + j.expires_in*1000 - 30000);
  if(j.refresh_token) store.set("refresh", j.refresh_token);
}
async function handleRedirect(){
  const code = new URLSearchParams(location.search).get("code");
  if(!code) return;
  history.replaceState({}, "", location.pathname);
  try{
    await tokenRequest({client_id:store.get("cid"),grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:store.get("verifier")});
  }catch(e){ console.error(e); window.authErr = e.message; }
}
function sessionExpired(extra){
  ["access","refresh","expires"].forEach(store.del);
  $("logout").hidden = true;
  showSetup();
  main.insertAdjacentHTML("beforeend", '<p class="msg">A sessão expirou e não foi possível renová-la' + (extra ? " (" + esc(extra) + ")" : "") + '. Entra de novo.</p>');
}
async function getToken(){
  if(!store.get("access")) return null;
  if(Date.now() < +store.get("expires")) return store.get("access");
  try{
    await tokenRequest({client_id:store.get("cid"),grant_type:"refresh_token",refresh_token:store.get("refresh")});
    return store.get("access");
  }catch(e){
    sessionExpired(e.message);
    return null;
  }
}
function logout(){ ["access","refresh","expires"].forEach(store.del); location.reload(); }
$("logout").onclick = logout;

/* ---------- Tema, tamanho do texto e sincronia ---------- */
function applyTheme(t){ document.documentElement.dataset.theme = t; $("theme").textContent = t === "light" ? "Escuro" : "Claro"; }
applyTheme(store.get("theme") === "light" ? "light" : "dark");
$("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  store.set("theme", t); applyTheme(t);
};

let fs = Math.min(2, Math.max(.6, parseFloat(store.get("fs")) || 1));
function applyFs(){
  document.documentElement.style.setProperty("--fs", fs);
  store.set("fs", fs);
  focusLine(lastIdx, true);
}
$("fsMinus").onclick = () => { fs = Math.max(.6, +(fs - .1).toFixed(2)); applyFs(); };
$("fsPlus").onclick = () => { fs = Math.min(2, +(fs + .1).toFixed(2)); applyFs(); };

// offset > 0 faz a letra avançar mais cedo
let offset = parseFloat(store.get("offset")) || 0;
function applyOffset(){
  $("offVal").textContent = (offset > 0 ? "+" : "") + offset.toFixed(1) + "s";
  store.set("offset", offset);
  if(current.lines){ lastIdx = lineIndex(); focusLine(lastIdx); }
}
$("offMinus").onclick = () => { offset = +(offset - .25).toFixed(2); applyOffset(); };
$("offPlus").onclick = () => { offset = +(offset + .25).toFixed(2); applyOffset(); };
$("offVal").textContent = (offset > 0 ? "+" : "") + offset.toFixed(1) + "s";

/* ---------- UI ---------- */
function showSetup(){
  if(CLIENT_ID){
    main.innerHTML = `<div id="setup" style="display:block;text-align:center"><h2 style="margin:0 0 14px">Letras</h2><button id="go">Entrar com Spotify</button></div>`;
    $("go").onclick = login;
    return;
  }
  const bad = location.protocol === "file:" || location.hostname === "localhost";
  main.innerHTML = `<div id="setup" style="display:block">
    <h2 style="margin:0 0 6px">Ligar ao Spotify</h2>
    <div class="msg" style="margin:0;font-size:1rem">Cria uma app em developer.spotify.com e adiciona este endereço como Redirect URI:</div>
    <p><code>${esc(REDIRECT)}</code></p>
    ${bad ? '<div class="msg" style="margin:0;font-size:.9rem;color:var(--hi)">O Spotify não aceita file:// nem localhost. Serve a página em https:// ou em http://127.0.0.1:PORTA.</div>' : ""}
    <label for="cid">Client ID</label>
    <input id="cid" autocomplete="off" value="${esc(store.get("cid")||"")}">
    <button id="go">Entrar com Spotify</button></div>`;
  $("go").onclick = login;
}
function showMsg(t){ main.textContent = ""; const p = document.createElement("p"); p.className = "msg"; p.textContent = t; main.appendChild(p); }
function setTrack(name, artists){
  trackEl.textContent = "";
  const b = document.createElement("b"); b.textContent = name;
  trackEl.append(b, " \u2014 " + artists);
}

/* ---------- Lyrics ---------- */
let current = {id:null, lines:null, plain:false, dur:0};
let progress = 0, stamp = 0, playing = false, lastIdx = -2;

function parseLRC(txt){
  const out = [];
  for(const raw of txt.split("\n")){
    const m = raw.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/);
    if(!m) continue;
    for(const t of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g))
      out.push({t:(+t[1])*60+parseFloat(t[2]), text:m[2].trim()});
  }
  return out.sort((a,b)=>a.t-b.t);
}

// cache local das letras (guarda as últimas 60)
const CACHE_MAX = 60;
function cacheGet(id){ try{ const v = localStorage.getItem("ly:" + id); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function cacheSet(id, ly){
  const data = {syncedLyrics:ly.syncedLyrics||null, plainLyrics:ly.plainLyrics||null, instrumental:!!ly.instrumental};
  const key = "ly:" + id;
  try{
    localStorage.setItem(key, JSON.stringify(data));
    let order = JSON.parse(localStorage.getItem("lyOrder") || "[]").filter(k => k !== key);
    order.push(key);
    while(order.length > CACHE_MAX) localStorage.removeItem(order.shift());
    localStorage.setItem("lyOrder", JSON.stringify(order));
  }catch(e){
    try{ Object.keys(localStorage).filter(k => k.startsWith("ly:")).forEach(k => localStorage.removeItem(k)); localStorage.removeItem("lyOrder"); }catch(_){}
  }
}

async function fetchLyrics(item){
  const artist = item.artists[0].name, title = item.name, dur = Math.round(item.duration_ms/1000);
  const base = {artist_name:artist, track_name:title, duration:dur};
  // 1) correspondência exata (com álbum), 2) sem álbum
  for(const extra of [{album_name:item.album.name}, {}]){
    try{
      const r = await fetch("https://lrclib.net/api/get?" + new URLSearchParams({...base, ...extra}));
      if(r.ok){ const j = await r.json(); if(j.syncedLyrics || j.instrumental) return j; }
    }catch(e){}
  }
  // 3) pesquisa: prefere letra sincronizada e duração mais próxima
  const r = await fetch("https://lrclib.net/api/search?" + new URLSearchParams({artist_name:artist, track_name:title}));
  if(!r.ok) return null;
  const arr = await r.json();
  if(!arr.length) return null;
  const score = x => Math.abs((x.duration || 0) - dur);
  const synced = arr.filter(x => x.syncedLyrics).sort((a,b) => score(a) - score(b));
  if(synced.length && score(synced[0]) <= 5) return synced[0];
  const plain = arr.filter(x => x.plainLyrics).sort((a,b) => score(a) - score(b));
  return synced[0] || plain[0] || arr[0];
}

function nowSec(){
  const elapsed = playing ? (performance.now() - stamp) : 0;
  return (progress + elapsed)/1000 + offset;
}
function lineIndex(){
  const t = nowSec();
  let idx = -1;
  for(let i=0;i<current.lines.length;i++){ if(current.lines[i].t <= t) idx = i; else break; }
  return idx;
}
function renderLines(){
  main.innerHTML = '<div id="stage"><div id="reel"></div></div>';
  const reel = $("reel");
  current.lines.forEach((l,i)=>{
    const d = document.createElement("div");
    d.className = "line"; d.id = "l"+i; d.textContent = l.text || "\u266A";
    d.onclick = () => { lastIdx = i; focusLine(i); };
    reel.appendChild(d);
  });
  lastIdx = lineIndex();
  focusLine(lastIdx, true);
}
function focusLine(idx, instant){
  const reel = $("reel"), stage = $("stage");
  if(!reel || !stage || !reel.children.length) return;
  const lines = reel.children, f = Math.max(idx, 0), el = lines[f];
  if(instant) reel.style.transition = "none";
  reel.style.transform = "translateY(" + (stage.clientHeight/2 - (el.offsetTop + el.offsetHeight/2)) + "px)";
  for(let i=0;i<lines.length;i++){
    const d = Math.abs(i - f), cur = idx >= 0 && i === idx;
    lines[i].classList.toggle("cur", cur);
    lines[i].style.opacity = cur ? 1 : (d === 0 ? .6 : Math.max(.12, .62 - d*.17));
    lines[i].style.transform = cur ? "scale(1.5)" : "scale(1)";
  }
  if(instant){ void reel.offsetHeight; reel.style.transition = ""; }
}
window.addEventListener("resize", () => focusLine(lastIdx, true));

// scroll automático da letra não sincronizada (pára 6s depois de o utilizador mexer)
let userScrolled = 0;
function autoScrollPlain(){
  const p = $("plain");
  if(!p || !current.dur || Date.now() - userScrolled < 6000) return;
  const frac = Math.min(1, Math.max(0, nowSec() * 1000 / current.dur));
  p.scrollTop = frac * (p.scrollHeight - p.clientHeight);
}
function tick(){
  if(current.lines && playing){
    const idx = lineIndex();
    if(idx !== lastIdx){ lastIdx = idx; focusLine(idx); }
  }else if(current.plain && playing){
    autoScrollPlain();
  }
  requestAnimationFrame(tick);
}

/* ---------- Polling ---------- */
let busy = false, pausedUntil = 0;
async function poll(retried){
  if(busy || Date.now() < pausedUntil) return;
  busy = true;
  try{ await pollOnce(retried); } finally { busy = false; }
}
async function pollOnce(retried){
  const tk = await getToken();
  if(!tk) return;
  try{
    const t0 = performance.now();
    const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing",{headers:{Authorization:"Bearer "+tk}});
    const t1 = performance.now();
    if(r.status === 204 || r.status === 202){ trackEl.textContent = "Nada a tocar"; playing = false; return; }
    if(r.status === 429){ pausedUntil = Date.now() + (parseInt(r.headers.get("Retry-After")) || 10) * 1000; return; }
    if(r.status === 401){
      if(retried){ sessionExpired("401"); return; }
      store.set("expires", 0);
      busy = false;
      return poll(true);
    }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const item = j.item;
    if(!item || j.currently_playing_type !== "track"){ playing = false; return; }
    // o progresso corresponde ao momento da resposta do servidor, aprox. a meio do pedido
    progress = j.progress_ms; stamp = (t0 + t1)/2; playing = j.is_playing;
    const id = item.id || item.uri;
    if(id !== current.id){
      current = {id, lines:null, plain:false, dur:item.duration_ms};
      setTrack(item.name, item.artists.map(a=>a.name).join(", "));
      showMsg("A procurar letra\u2026");
      let ly = cacheGet(id);
      if(!ly){
        ly = await fetchLyrics(item).catch(()=>null);
        if(ly && (ly.syncedLyrics || ly.plainLyrics || ly.instrumental)) cacheSet(id, ly);
      }
      if(current.id !== id) return;
      if(ly && ly.syncedLyrics){ current.lines = parseLRC(ly.syncedLyrics); renderLines(); }
      else if(ly && ly.plainLyrics){
        current.plain = true;
        main.innerHTML = `<div id="plain"></div>`;
        const p = $("plain"); p.textContent = ly.plainLyrics;
        ["wheel","touchstart","pointerdown"].forEach(ev => p.addEventListener(ev, () => { userScrolled = Date.now(); }, {passive:true}));
      }
      else if(ly && ly.instrumental){ showMsg("Instrumental."); }
      else showMsg("Letra n\u00E3o encontrada para esta m\u00FAsica.");
    }else if(current.lines){
      // atualiza logo depois de pausa, retoma ou seek
      const idx = lineIndex();
      if(idx !== lastIdx){ lastIdx = idx; focusLine(idx); }
    }
  }catch(e){ console.error(e); if(!current.id) showMsg("Erro ao obter a m\u00FAsica: " + e.message); }
}

/* ---------- Ecrã sempre ligado ---------- */
let wakeLock = null;
async function keepAwake(){
  try{
    if("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); poll(); } });

/* ---------- GPS: esconder letra em movimento ---------- */
let watch = null;
$("hideMoving").onchange = e => {
  if(watch !== null){ navigator.geolocation.clearWatch(watch); watch = null; }
  document.body.classList.remove("moving"); $("speed").textContent = "";
  if(!e.target.checked || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition(p=>{
    const kmh = (p.coords.speed || 0) * 3.6;
    document.body.classList.toggle("moving", kmh > 5);
    $("speed").textContent = Math.round(kmh) + " km/h";
  }, ()=>{ $("speed").textContent = "GPS indispon\u00EDvel"; }, {enableHighAccuracy:true});
};

/* ---------- Start ---------- */
(async function(){
  document.documentElement.style.setProperty("--fs", fs);
  await handleRedirect();
  if(!store.get("access")){
    showSetup();
    store.set("t","1");
    if(store.get("t") !== "1") main.insertAdjacentHTML("beforeend", '<p class="msg">Este browser n\u00E3o est\u00E1 a guardar dados do site, por isso o login n\u00E3o fica guardado.</p>');
    if(window.authErr) main.insertAdjacentHTML("beforeend", '<p class="msg">Erro no login: ' + esc(window.authErr) + '. Confirma que o Redirect URI no Spotify \u00E9 exatamente ' + esc(REDIRECT) + '</p>');
    return;
  }
  $("logout").hidden = false;
  showMsg("A ligar\u2026");
  keepAwake();
  poll(); setInterval(poll, 4000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
