<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letras</title>
<style>
:root{--bg:#14171f;--ink:#f1ede4;--dim:#6b7285;--hi:#ffb86b;--panel:#1d212c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #262b38}
#track{font-size:1rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track b{color:var(--ink);font-weight:600}
button{font:inherit;background:var(--hi);color:#2a1a05;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--dim);border:1px solid #333a4a;font-weight:400;padding:6px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 6vw;overflow:hidden;text-align:center}
#stage{flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#reel{position:absolute;left:0;right:0;top:0;transition:transform .8s cubic-bezier(.25,.8,.25,1);will-change:transform}
.line{width:64%;margin:0 auto;padding:.8em 0;font-size:clamp(1.2rem,2.8vw,2rem);font-weight:600;line-height:1.3;color:var(--dim);transform-origin:center;transition:transform .6s cubic-bezier(.25,.8,.25,1),opacity .6s,color .6s}
.line.cur{color:var(--hi)}
#plain{white-space:pre-wrap;text-align:left;max-width:60ch;margin:0 auto;overflow:auto;font-size:1.4rem;line-height:1.5;color:var(--ink)}
.msg{color:var(--dim);font-size:1.2rem;max-width:46ch;margin:0 auto;line-height:1.5}
#setup{max-width:520px;margin:0 auto;text-align:left;background:var(--panel);padding:22px;border-radius:14px;display:none}
#setup label{display:block;margin:12px 0 6px;color:var(--dim);font-size:.9rem}
#setup input{width:100%;padding:10px;border-radius:8px;border:1px solid #333a4a;background:#12151c;color:var(--ink);font:inherit}
#setup code{background:#12151c;padding:2px 6px;border-radius:5px;word-break:break-all;font-size:.85rem}
#setup button{margin-top:16px}
footer{padding:10px 22px;display:flex;gap:14px;align-items:center;border-top:1px solid #262b38;color:var(--dim);font-size:.9rem}
footer label{display:flex;gap:6px;align-items:center;cursor:pointer}
:root[data-theme="light"]{--bg:#f4f1ea;--ink:#1c2030;--dim:#6f7588;--hi:#b8520a;--panel:#fff;color-scheme:light}
:root[data-theme="light"] header,:root[data-theme="light"] footer{border-color:#ddd6c6}
:root[data-theme="light"] button.ghost,:root[data-theme="light"] #setup input{border-color:#d3ccbb}
:root[data-theme="light"] #setup input,:root[data-theme="light"] #setup code{background:#f4f1ea;color:var(--ink)}
:root[data-theme="light"] button:not(.ghost){color:#fff}
#ver{position:fixed;right:10px;bottom:8px;font-size:.7rem;color:var(--dim);opacity:.8;pointer-events:none}
body.moving main{filter:blur(18px);opacity:.15;pointer-events:none}
@media (prefers-reduced-motion:reduce){.line,#reel{transition:none}}
</style>
</head>
<body>
<header><div id="track">Nada a tocar</div><div style="display:flex;gap:8px;align-items:center;flex:none"><button class="ghost" id="theme">Claro</button><button class="ghost" id="logout" hidden>Sair</button></div></header>
<main id="main"></main>
<footer>
  <label><input type="checkbox" id="hideMoving"> Esconder letra com o carro em movimento (GPS)</label>
  <span id="speed"></span>
</footer>

<div id="ver">v1.5</div>
<script>
window.addEventListener("error",function(e){var m=document.getElementById("main");if(m)m.innerHTML='<p class="msg">Erro: '+e.message+'</p>';});
window.addEventListener("unhandledrejection",function(e){var m=document.getElementById("main");if(m)m.innerHTML='<p class="msg">Erro: '+(e.reason&&e.reason.message||e.reason)+'</p>';});
</script>
<script>
const SCOPES = "user-read-currently-playing user-read-playback-state";
const CLIENT_ID = ""; // cola aqui o teu Client ID, entre as aspas
const REDIRECT = location.origin + location.pathname;
const $ = id => document.getElementById(id);
const main = $("main"), trackEl = $("track");
const store = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- PKCE ---------- */
const rand = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/[+/=]/g,"").slice(0,n); };
async function challenge(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const id = CLIENT_ID || $("cid").value.trim();
  if(!id) return;
  store.set("cid", id);
  const verifier = rand(64);
  store.set("verifier", verifier);
  const p = new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:await challenge(verifier)});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  if(!r.ok) throw new Error("token " + r.status);
  const j = await r.json();
  store.set("access", j.access_token);
  store.set("expires", Date.now() + j.expires_in*1000 - 30000);
  if(j.refresh_token) store.set("refresh", j.refresh_token);
}
async function handleRedirect(){
  const code = new URLSearchParams(location.search).get("code");
  if(!code) return;
  history.replaceState({}, "", location.pathname);
  try{
    await tokenRequest({client_id:store.get("cid"),grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:store.get("verifier")});
  }catch(e){ console.error(e); window.authErr = e.message; }
}
async function getToken(){
  if(!store.get("access")) return null;
  if(Date.now() < +store.get("expires")) return store.get("access");
  try{
    await tokenRequest({client_id:store.get("cid"),grant_type:"refresh_token",refresh_token:store.get("refresh")});
    return store.get("access");
  }catch(e){
    store.del("access"); store.del("refresh"); $("logout").hidden = true;
    showSetup();
    main.insertAdjacentHTML("beforeend", '<p class="msg">A sessão expirou e não foi possível renová-la (' + e.message + '). Entra de novo.</p>');
    return null;
  }
}
function logout(){ ["access","refresh","expires"].forEach(store.del); location.reload(); }
$("logout").onclick = logout;

/* ---------- Tema ---------- */
function applyTheme(t){ document.documentElement.dataset.theme = t; $("theme").textContent = t === "light" ? "Escuro" : "Claro"; }
applyTheme(store.get("theme") === "light" ? "light" : "dark");
$("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  store.set("theme", t); applyTheme(t);
};

/* ---------- UI ---------- */
function showSetup(){
  if(CLIENT_ID){
    main.innerHTML = `<div id="setup" style="display:block;text-align:center"><h2 style="margin:0 0 14px">Letras</h2><button id="go">Entrar com Spotify</button></div>`;
    $("go").onclick = login;
    return;
  }
  main.innerHTML = `<div id="setup" style="display:block">
    <h2 style="margin:0 0 6px">Ligar ao Spotify</h2>
    <div class="msg" style="margin:0;font-size:1rem">Cria uma app em developer.spotify.com e adiciona este endereço como Redirect URI:</div>
    <p><code>${REDIRECT}</code></p>
    <label for="cid">Client ID</label>
    <input id="cid" autocomplete="off" value="${store.get("cid")||""}">
    <button id="go">Entrar com Spotify</button></div>`;
  $("go").onclick = login;
}
function showMsg(t){ main.innerHTML = `<p class="msg">${t}</p>`; }

/* ---------- Lyrics ---------- */
let current = {id:null, lines:null, plain:null};
let progress = 0, stamp = 0, playing = false, lastIdx = -2;

function parseLRC(txt){
  const out = [];
  for(const raw of txt.split("\n")){
    const m = raw.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/);
    if(!m) continue;
    for(const t of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g))
      out.push({t:(+t[1])*60+parseFloat(t[2]), text:m[2].trim()});
  }
  return out.sort((a,b)=>a.t-b.t);
}
async function fetchLyrics(item){
  const artist = item.artists[0].name, title = item.name;
  const q = new URLSearchParams({artist_name:artist,track_name:title,album_name:item.album.name,duration:Math.round(item.duration_ms/1000)});
  let r = await fetch("https://lrclib.net/api/get?" + q);
  if(!r.ok){
    r = await fetch("https://lrclib.net/api/search?" + new URLSearchParams({artist_name:artist,track_name:title}));
    if(!r.ok) return null;
    const arr = await r.json();
    return arr[0] || null;
  }
  return r.json();
}
function lineIndex(){
  const t = (progress + performance.now() - stamp)/1000;
  let idx = -1;
  for(let i=0;i<current.lines.length;i++){ if(current.lines[i].t <= t) idx = i; else break; }
  return idx;
}
function renderLines(){
  main.innerHTML = '<div id="stage"><div id="reel"></div></div>';
  const reel = $("reel");
  current.lines.forEach((l,i)=>{
    const d = document.createElement("div");
    d.className = "line"; d.id = "l"+i; d.textContent = l.text || "♪";
    reel.appendChild(d);
  });
  lastIdx = lineIndex();
  focusLine(lastIdx, true);
}
function focusLine(idx, instant){
  const reel = $("reel"), stage = $("stage");
  if(!reel || !reel.children.length) return;
  const lines = reel.children, f = Math.max(idx, 0), el = lines[f];
  if(instant) reel.style.transition = "none";
  reel.style.transform = "translateY(" + (stage.clientHeight/2 - (el.offsetTop + el.offsetHeight/2)) + "px)";
  for(let i=0;i<lines.length;i++){
    const d = Math.abs(i - f), cur = idx >= 0 && i === idx;
    lines[i].classList.toggle("cur", cur);
    lines[i].style.opacity = cur ? 1 : (d === 0 ? .6 : Math.max(.12, .62 - d*.17));
    lines[i].style.transform = cur ? "scale(1.5)" : "scale(1)";
  }
  if(instant){ void reel.offsetHeight; reel.style.transition = ""; }
}
window.addEventListener("resize", () => focusLine(lastIdx, true));
function tick(){
  if(current.lines && playing){
    const idx = lineIndex();
    if(idx !== lastIdx){ lastIdx = idx; focusLine(idx); }
  }
  requestAnimationFrame(tick);
}

/* ---------- Polling ---------- */
async function poll(){
  const tk = await getToken();
  if(!tk) return;
  try{
    const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing",{headers:{Authorization:"Bearer "+tk}});
    if(r.status === 204 || r.status === 202){ trackEl.textContent = "Nada a tocar"; playing = false; return; }
    if(r.status === 429){ return; }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const item = j.item;
    if(!item || j.currently_playing_type !== "track"){ playing = false; return; }
    progress = j.progress_ms; stamp = performance.now(); playing = j.is_playing;
    if(item.id !== current.id){
      current = {id:item.id, lines:null, plain:null};
      trackEl.innerHTML = `<b>${item.name}</b> — ${item.artists.map(a=>a.name).join(", ")}`;
      showMsg("A procurar letra…");
      const ly = await fetchLyrics(item).catch(()=>null);
      if(current.id !== item.id) return;
      if(ly && ly.syncedLyrics){ current.lines = parseLRC(ly.syncedLyrics); renderLines(); }
      else if(ly && ly.plainLyrics){ main.innerHTML = `<div id="plain"></div>`; $("plain").textContent = ly.plainLyrics; }
      else if(ly && ly.instrumental){ showMsg("Instrumental."); }
      else showMsg("Letra não encontrada para esta música.");
    }
  }catch(e){ console.error(e); if(!current.id) showMsg("Erro ao obter a música: " + e.message); }
}

/* ---------- GPS: esconder letra em movimento ---------- */
let watch = null;
$("hideMoving").onchange = e => {
  if(watch !== null){ navigator.geolocation.clearWatch(watch); watch = null; }
  document.body.classList.remove("moving"); $("speed").textContent = "";
  if(!e.target.checked || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition(p=>{
    const kmh = (p.coords.speed || 0) * 3.6;
    document.body.classList.toggle("moving", kmh > 5);
    $("speed").textContent = Math.round(kmh) + " km/h";
  }, ()=>{ $("speed").textContent = "GPS indisponível"; }, {enableHighAccuracy:true});
};

/* ---------- Start ---------- */
(async function(){
  await handleRedirect();
  if(!store.get("access")){
    showSetup();
    store.set("t","1");
    if(store.get("t") !== "1") main.insertAdjacentHTML("beforeend", '<p class="msg">Este browser não está a guardar dados do site, por isso o login não fica guardado.</p>');
    if(window.authErr) main.insertAdjacentHTML("beforeend", '<p class="msg">Erro no login: ' + window.authErr + '. Confirma que o Redirect URI no Spotify é exatamente ' + REDIRECT + '</p>');
    return;
  }
  $("logout").hidden = false;
  showMsg("A ligar…");
  poll(); setInterval(poll, 4000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
